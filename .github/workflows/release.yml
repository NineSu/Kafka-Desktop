name: Release installers

# Push a v* tag (e.g. v1.0.0) to build self-contained installers on all three OSes and
# publish them to a GitHub Release. The macOS bundle version must start with a non-zero
# integer, so use tags like v1.0.0 / v1.2.3 (not v0.x).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for the release job to create a Release

jobs:
  package:
    strategy:
      fail-fast: false   # run all three OSes independently so one failure doesn't hide the others
      matrix:
        include:
          - os: macos-latest
            artifact_glob: app/build/jpackage/dist/*.dmg
          - os: windows-latest
            artifact_glob: app/build/jpackage/dist/*.msi
          - os: ubuntu-latest
            artifact_glob: app/build/jpackage/dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # ships jpackage

      # jpackage --type msi needs WiX 3.x (candle/light). Ensure it is present.
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress
        shell: pwsh

      - name: Build installer
        shell: bash   # git-bash on Windows, so ./gradlew works everywhere
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:jpackage -PappVersion="$VERSION" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts   # downloads each installer-* dir under artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
